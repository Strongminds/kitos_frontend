apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    easyhosting.io/service-reference: Dockerfile
    easyhosting.io/service-unique-id: 52998d73-6104-4c8c-9a5c-fe3ce5235041
    easyhosting.io/easy-hosting-domain-name: 52998d73-6104-4c8c-9a5c-fe3ce5235041.dev.os2-kitos.easyhosting.strongminds.dev
  labels:
    app: kitos-frontend
  name: kitos-frontend
  namespace: kitos-staging
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: kitos-frontend
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations:
        sidecar.opentelemetry.io/inject: monitoring/sidecar-otel-collector
        easyhosting.io/otlp-logs: "true"
      labels:
        app: kitos-frontend
        app.kubernetes.io/name: kitos-frontend
    spec:
      containers:
      - env:
        - name: BACKEND_URL
          valueFrom:
            configMapKeyRef:
              key: KitosApiBaseUrlInternal
              name: user-variables
        image: '{will be replaced by build pipeline}'
        name: kitos-frontend
        ports:
        - containerPort: 80
          name: http
          protocol: TCP
        resources:
          limits:
            memory: 512Mi
            cpu: 1
          requests:
            memory: 64Mi
            cpu: 100m
      imagePullSecrets:
      - name: ab5abbe3-d515-459a-83e8-c47a88a0fa1c