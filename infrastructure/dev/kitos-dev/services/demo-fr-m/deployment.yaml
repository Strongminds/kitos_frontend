apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    easyhosting.io/service-reference: Dockerfile
    easyhosting.io/service-unique-id: a4841cd7-d591-4b75-b1f0-9fb10b8f6635
    easyhosting.io/easy-hosting-domain-name: a4841cd7-d591-4b75-b1f0-9fb10b8f6635.dev.os2-kitos.easyhosting.strongminds.dev
  labels:
    app: demo-fr-m
  name: demo-fr-m
  namespace: kitos-dev
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: demo-fr-m
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations:
        sidecar.opentelemetry.io/inject: "false"
        easyhosting.io/otlp-logs: "false"
      labels:
        app: demo-fr-m
        app.kubernetes.io/name: demo-fr-m
    spec:
      containers:
      - env:
        - name: BACKEND_URL
          valueFrom:
            configMapKeyRef:
              key: KitosApiBaseUrlInternal
              name: user-variables
        image: '{will be replaced by build pipeline}'
        name: demo-fr-m
        ports:
        - containerPort: 80
          name: http
          protocol: TCP
        resources:
          limits:
            memory: 512Mi
            cpu: 1
          requests:
            memory: 128Mi
            cpu: 100m
      imagePullSecrets:
      - name: ab5abbe3-d515-459a-83e8-c47a88a0fa1c