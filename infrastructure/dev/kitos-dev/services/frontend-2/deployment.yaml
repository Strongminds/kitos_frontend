apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    easyhosting.io/service-reference: Dockerfile
    easyhosting.io/service-unique-id: 148a4642-f273-49a6-b2fb-0ed68de4c933
    easyhosting.io/easy-hosting-domain-name: 148a4642-f273-49a6-b2fb-0ed68de4c933.dev.os2-kitos.easyhosting.strongminds.dev
  labels:
    app: frontend-2
  name: frontend-2
  namespace: kitos-dev
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: frontend-2
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations:
        sidecar.opentelemetry.io/inject: "false"
        easyhosting.io/otlp-logs: "false"
      labels:
        app: frontend-2
        app.kubernetes.io/name: frontend-2
    spec:
      containers:
      - env:
        - name: BACKEND_URL
          valueFrom:
            configMapKeyRef:
              key: KitosApiBaseUrlInternal
              name: user-variables
        image: '{will be replaced by build pipeline}'
        name: frontend-2
        ports:
        - containerPort: 80
          name: http
          protocol: TCP
        resources:
          limits:
            memory: 512Mi
            cpu: 1
          requests:
            memory: 128Mi
            cpu: 100m
      imagePullSecrets:
      - name: ab5abbe3-d515-459a-83e8-c47a88a0fa1c