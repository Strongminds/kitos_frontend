apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: easy-hosting-issuer
  name: frontend-demo
  namespace: kitos-dev
spec:
  rules:
  - host: 6980981e-b844-472c-9e1c-525a65ac2521.dev.os2-kitos.easyhosting.strongminds.dev
    http:
      paths:
      - backend:
          service:
            name: frontend-demo
            port:
              name: http
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - 6980981e-b844-472c-9e1c-525a65ac2521.dev.os2-kitos.easyhosting.strongminds.dev
    secretName: 6980981e-b844-472c-9e1c-525a65ac2521-dev-os2-kitos-easyhosting-strongminds-dev-tls