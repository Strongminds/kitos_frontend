server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api {
        proxy_http_version 1.1;
        proxy_pass ${BACKEND_URL};
    }

    location /odata {
        proxy_http_version 1.1;
        proxy_pass ${BACKEND_URL};
    }

    location /LoginHandler.ashx {
        proxy_http_version 1.1;
        proxy_pass ${BACKEND_URL};
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}