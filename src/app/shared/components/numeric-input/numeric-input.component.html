@if (formGroup) {
  <mat-form-field [formGroup]="formGroup" class="{{ size }}">
    <mat-label>
      {{ text }}
      @if (recommended) {
        <span [class.filled]="formName && formGroup.controls[formName].value" class="recommended-badge" i18n>Anbefalet</span>
      }
    </mat-label>
    <input
      matInput
      type="text"
      [placeholder]="placeholder"
      [formControlName]="formName"
      (input)="formInputValueChange($event)"
      (focus)="focus(true)"
      (blur)="focus(false)"
      #input
      />
  </mat-form-field>
}

@if (!formGroup) {
  <mat-form-field class="{{ size }}">
    <mat-label>
      {{ text }}
      @if (recommended) {
        <span [class.filled]="value !== undefined && value !== null" class="recommended-badge" i18n>Anbefalet</span>
      }
    </mat-label>
    <input
      matInput
      type="text"
      [placeholder]="placeholder"
      [disabled]="disabled"
      [(ngModel)]="value"
      (ngModelChange)="inputChanged($event)"
      #input
      />
  </mat-form-field>
}
