@if(initialized){ @if(formGroup){

<mat-form-field [formGroup]="formGroup">
  <mat-label>
    {{ text }}
    <app-recommended-badge [visible]="recommended" [filled]="(formName && formGroup.controls[formName].value) === true"></app-recommended-badge>
  </mat-label>
  <textarea
    #autosizeTextarea
    matInput
    cdkTextareaAutosize
    [cdkAutosizeMinRows]="autosizeMinRows"
    [cdkAutosizeMaxRows]="autosizeMaxRows"
    type="text"
    [formControlName]="formName"
    (input)="formInputValueChange($event)"
    (focus)="focus(true)"
    (blur)="focus(false)"
    [ngClass]="{ disabled: disabled }"
  ></textarea>
</mat-form-field>
} @else {
<mat-form-field>
  <mat-label>
    {{ text }}
    <app-recommended-badge [visible]="recommended" [filled]="value !== undefined && value !== null"></app-recommended-badge>
  </mat-label>
  <textarea
    #autosizeTextarea
    matInput
    cdkTextareaAutosize
    [cdkAutosizeMinRows]="autosizeMinRows"
    [cdkAutosizeMaxRows]="autosizeMaxRows"
    type="text"
    [disabled]="disabled"
    [(ngModel)]="value"
    (ngModelChange)="valueChange.emit($event)"
    [ngClass]="{ disabled: disabled }"
  ></textarea>
</mat-form-field>
} }
