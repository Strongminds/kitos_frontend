<app-accordion
  [title]="title"
  [isExpanded]="(isExpanded$ | async) ?? false"
  (expandedChanged)="onExpandedChanged($event)"
>
  <form [formGroup]="formGroup">
    <app-standard-vertical-content-grid>
      <app-dropdown
        [text]="choiceTypeTitle"
        [formGroup]="formGroup"
        formName="yesNoDontKnowControl"
        [data]="yesNoDontKnowOptions"
        (valueChange)="preparePatch(choiceTypePropertyName, $event)"
        data-cy="url-section-dropdown"
        class="full-width-column"
        [recommended]="choiceTypeRecommended"
      ></app-dropdown>
      <app-datepicker
        [text]="dateTitle"
        [formGroup]="formGroup"
        formName="dateControl"
        class="full-width-column"
        [recommended]="choiceTypeRecommended"
        (valueChange)="preparePatch(datePropertyName, $event?.toDateString())"
      >
      </app-datepicker>
      <app-edit-url-section
        [title]="linkTitle"
        [simpleLink$]="documentation$"
        [isDisabled]="(isYesNoDontKnowFalse$ | async) !== false"
        data-cy="base-date-url-section-selector"
        [recommended]="choiceTypeRecommended"
        [isDisabled]="disableLinkControl"
        (submitMethod)="patchSimpleLink($event)"
      >
      </app-edit-url-section>
    </app-standard-vertical-content-grid>
  </form>
</app-accordion>
