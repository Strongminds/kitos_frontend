@if (paymentModelEnabled$ | async) {
  <app-card>
    <app-card-header title="Betalingsmodel" i18n-title helpTextKey="it-contract.edit.economy"></app-card-header>
    <app-form-grid [formGroup]="economyFormGroup">
      <app-datepicker
        text="Driftsvederlag påbegyndt"
        i18n-text
        data-cy="contract-operations-date"
        [formGroup]="economyFormGroup"
        formName="operationsRemunerationStartedAt"
        [recommended]="(paymentModelRecommended$ | async) === true"
        (valueChange)="patchEconomy({ paymentModel: { operationsRemunerationStartedAt: $event?.toDateString() } })"
      ></app-datepicker>
      <app-dropdown
        text="Betalingsfrekvens"
        i18n-text
        data-cy="contract-payment-frequency"
        valueField="uuid"
        [formGroup]="economyFormGroup"
        formName="paymentFrequency"
        [data]="paymentFrequencyOptions$ | async"
        [recommended]="(paymentModelRecommended$ | async) === true"
        (valueChange)="patchEconomy({ paymentModel: { paymentFrequencyUuid: $event } })"
        >
      </app-dropdown>
      <app-dropdown
        text="Betalingsmodel"
        i18n-text
        data-cy="contract-payment-model"
        valueField="uuid"
        [formGroup]="economyFormGroup"
        formName="paymentModel"
        [data]="paymentModelOptions$ | async"
        [recommended]="(paymentModelRecommended$ | async) === true"
        (valueChange)="patchEconomy({ paymentModel: { paymentModelUuid: $event } })"
        >
      </app-dropdown>
      <app-dropdown
        text="Prisregulering"
        i18n-text
        data-cy="contract-price-regulation"
        valueField="uuid"
        [formGroup]="economyFormGroup"
        formName="priceRegulation"
        [data]="priceRegulationOptions$ | async"
        [recommended]="(paymentModelRecommended$ | async) === true"
        (valueChange)="patchEconomy({ paymentModel: { priceRegulationUuid: $event } })"
        >
      </app-dropdown>
      <app-dropdown
        text="Faktureringsperiode"
        i18n-text
        data-cy="contract-invoice-frequency"
        valueField="value"
        [formGroup]="economyFormGroup"
        formName="invoiceFrequency"
        [data]="invoiceFrequencyOptions"
        [clearable]="false"
        (valueChange)="onInvoiceFrequencyChange($event)"
      ></app-dropdown>
      @for (period of invoicePeriods; track period.period) {
        <div class="invoice-period-row">
          <app-textbox
            text="Periode"
            i18n-text
            [formGroup]="economyFormGroup"
            [formName]="'invoicePeriod' + period.period"
          ></app-textbox>
          <app-dropdown
            text="Måned"
            i18n-text
            [formGroup]="economyFormGroup"
            [formName]="'invoiceMonth' + period.period"
            valueField="value"
            [data]="period.monthOptions"
            [clearable]="false"
            [attr.data-cy]="'contract-invoice-month-' + period.period"
            (valueChange)="onInvoiceMonthChange(period.period, $event)"
          ></app-dropdown>
          <app-dropdown
            text="Dag"
            i18n-text
            [formGroup]="economyFormGroup"
            [formName]="'invoiceDay' + period.period"
            valueField="value"
            [data]="period.dayOptions"
            [clearable]="false"
            [attr.data-cy]="'contract-invoice-day-' + period.period"
            (valueChange)="onInvoiceDayChange(period.period, $event)"
          ></app-dropdown>
        </div>
      }
    </app-form-grid>
  </app-card>
}
@if (externalPaymentEnabled$ | async) {
  <app-payment-table
    title="Ekstern betaling"
    helpTextKey="it-contract.edit.external-payments"
    [payments$]="externalPayments$"
    [anyPayments$]="anyExternalPayments$"
    paymentType="external"
    [recommended]="(externalPaymentRecommended$ | async) === true"
  ></app-payment-table>
}
@if (internalPaymentEnabled$ | async) {
  <app-payment-table
    title="Intern betaling"
    helpTextKey="it-contract.edit.internal-payments"
    [payments$]="internalPayments$"
    [anyPayments$]="anyInternalPayments$"
    paymentType="internal"
    [recommended]="(internalPaymentRecommended$ | async) === true"
  ></app-payment-table>
}
